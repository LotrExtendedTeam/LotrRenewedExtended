name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened,closed,synchronize]

# allow concurent cla tasks to run
concurrency:
  group: cla
  cancel-in-progress: false
  
# explicitly configure permissions, in case your GITHUB_TOKEN workflow permissions are set to read-only in repository settings
permissions:
  actions: write
  contents: write # this can be 'read' if the signatures are in remote repository
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # depricated and archived in 2026, migrate to new new fork once exists
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/LotrExtendedTeam/LotrRenewedExtended/blob/main/CLA.md'
          # branch should not be protected
          branch: 'signatures'
          allowlist: maximuslotro,github-actions[bot]
          custom-notsigned-prcomment: >
            Thank you for your contribution! Before it can be merged, you need to
            sign the [Contributor License Agreement](https://github.com/LotrExtendedTeam/LotrRenewedExtended/blob/main/CLA.md')
            (a one-time step covering all your future contributions). Please read it,
            then sign by posting the comment below.
          custom-allsigned-prcomment: '**CLA Assistant** All Contributors have signed the CLA.'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'