buildscript {
    repositories {
        maven { 
        	url = 'https://maven.minecraftforge.net'
        }
        maven {
            name = "sponge"
            url = "https://repo.spongepowered.org/repository/maven-public/"
        }
		mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
        classpath files('libs/plugins/mixingradle-0.7-custom.jar')
        classpath 'org.parchmentmc:librarian:1.+'
    }
}

plugins {
    id 'idea'
    id 'com.diffplug.eclipse.apt' version '3.35.0'
    id 'net.minecraftforge.gradle' version '5.1.+'
    // This should be below the net.minecraftforge.gradle plugin
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}
apply plugin: 'org.spongepowered.mixin'

version = '1.10.0-alpha-2'
group = 'maximuslotro'
archivesBaseName = 'lotr-1.16-extended-beta'

java.toolchain.languageVersion = JavaLanguageVersion.of(8) // Mojang ships Java 8 to end users, so your mod should target Java 8.

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))
minecraft {
    mappings channel: 'parchment', version: '2022.03.06-1.16.5'
    // makeObfSourceJar = false // an Srg named sources jar is made by default. uncomment this to disable.
    
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                lotrextended {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                lotrextended {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', 'lotrextended', '--all', '--existing-mod', 'lotr','--output', file('src/generated/resources/'), '--existing', file('src/main/resources/'), '--existing', file('src/generated/resources/')

            mods {
                lotrextended {
                    source sourceSets.main
                }
            }
        }
    }
}
repositories {
	mavenCentral()
	maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven { url 'https://jitpack.io' }
    maven { url = "https://maven.enginehub.org/repo/" }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.16.5-36.2.39'
    //lotr mod dep
    implementation fg.deobf("curse.maven:the-lord-of-the-rings-mod-renewed-406893:3661524")
    // jei lotr
    implementation fg.deobf("curse.maven:jei-238222:5846870")
    implementation fg.deobf("curse.maven:jei-lotr-380404:3779945")
    //annonations processor
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    implementation 'com.github.lotrextendedteam:questinglib:0.1.0'
    // worldEdit compat
    compileOnly fg.deobf("com.sk89q.worldedit:worldedit-core:7.2.6-SNAPSHOT")
    compileOnly fg.deobf("com.sk89q.worldedit:worldedit-forge-mc1.16.3:7.2.6-SNAPSHOT")
}

// Include resources generated by data generators.
sourceSets {
    main {
        resources {
            srcDir 'src/generated/resources'
            // Exclude everything under "info" folder(s)
            exclude 'info/**', '.cache/**'
        }
    }
}
sourceSets {
    def deps = [
		configurations.minecraft,
		//configurations.compile,
		configurations.compileClasspath,
		configurations.runtimeClasspath
	]
	main {
		compileClasspath += files(deps)
        ext.refMap = "mixins.lotrextended.refmap.json"
	}
}

mixin {
    add sourceSets.main, "mixins.lotrextended.refmap.json"

    config 'mixins.lotrextended.json'
    disableTargetValidator = false
    overwriteErrorLevel = 'error'
}

// Configure server resource processing
project.processResources {
	from (sourceSets.main.resources.srcDirs) {
		include 'META-INF/mods.toml'
		duplicatesStrategy = DuplicatesStrategy.INCLUDE
		expand (
			'version': project.version
		)
	}
}
// Example for how to get properties into the manifest for reading by the runtime..
jar {
    manifest {
        attributes([
            "Specification-Title": "lotrextended",
            "Specification-Vendor": "lotrextended",
            "Specification-Version": "1", // We are version 1 of ourselves
            "Implementation-Title": "MDK",
            "Implementation-Version": "lotrextended",
            "Implementation-Vendor" :"lotrextended",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            "MixinConfigs": "mixins.lotrextended.json",
            "FMLAT": "accesstransformer.cfg"
        ])
    }
}

/************************************************************
 * Others
 */

reobf {
	jar{}
}